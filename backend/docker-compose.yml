services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menu}
      POSTGRES_USER: ${POSTGRES_USER:-menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menu}"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Раз в минуту: истечение заявок (10 мин), напоминания, автозавершение.
  scheduler:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: python manage.py run_periodic --loop
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
